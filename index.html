<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2a44" />
    <title>Spinbound</title>
  </head>
  <body data-screen="menu">
    <main id="game" aria-label="횡스크롤 액션 게임"></main>
    <header><span class="brand">SPINBOUND <small id="stage-label">STAGE 1 / 10</small></span><div class="header-actions"><button id="sound-toggle" class="hud-button" type="button" aria-label="사운드 끄기" aria-pressed="true">ON</button><button id="restart" class="hud-button" type="button">재시작</button><button id="lobby" class="hud-button" type="button">로비</button></div></header>
    <div id="scoreboard" aria-label="현재 기록"><span class="chip-score"><i class="icon icon-star" aria-hidden="true"></i><span class="sr-only">점수</span><strong id="score">0</strong></span><span class="chip-coin"><i class="coin-icon" aria-hidden="true"></i><span class="sr-only">코인</span><strong id="coin-count">0</strong></span><span class="chip-hp"><span class="sr-only">HP</span><strong id="hp" role="img" aria-label="HP 3 / 3">3 / 3</strong></span><span id="speed-hud" class="speed-hud">SPEED <i class="speed-meter"><b></b></i> <strong>SPIN</strong></span></div>
    <p id="status" role="status">← → / A D 이동 · Space / ↑ 점프 · 빠르게 달리면 자동 구르기</p>
    <nav aria-label="게임 조작">
      <div><button data-control="left" class="pad-button" aria-label="왼쪽 이동"><i class="icon icon-left" aria-hidden="true"></i></button><button data-control="right" class="pad-button" aria-label="오른쪽 이동"><i class="icon icon-right" aria-hidden="true"></i></button></div>
      <div class="actions"><button data-control="jump" class="pad-button" aria-label="점프, 길게 누르면 더 높이"><i class="icon icon-jump" aria-hidden="true"></i><span>점프</span></button></div>
    </nav>
    <section id="result" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
      <div class="result-card">
        <i class="result-badge" aria-hidden="true"></i>
        <h1 id="result-title">STAGE CLEAR!</h1>
        <p id="result-stats"></p>
        <button id="result-next" type="button" hidden>다음 스테이지 →</button>
        <button id="result-restart" type="button">Stage 1부터 다시 시작</button>
        <button id="result-lobby" type="button">메인 로비</button>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
