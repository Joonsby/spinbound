<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2a44" />
    <title>Spinbound</title>
  </head>
  <body data-screen="menu">
    <main id="game" aria-label="횡스크롤 액션 게임"></main>
    <header><span class="brand">SPINBOUND <small id="stage-label">STAGE 1 / 10</small></span><div class="header-actions"><button id="sound-toggle" class="hud-button" type="button" aria-label="사운드 끄기" aria-pressed="true">ON</button><button id="restart" class="hud-button" type="button">재시작</button><button id="lobby" class="hud-button" type="button">로비</button></div></header>
    <div id="scoreboard" aria-label="현재 기록"><span class="chip-score"><i class="icon icon-star" aria-hidden="true"></i><span class="sr-only">점수</span><strong id="score">0</strong></span><span class="chip-coin"><i class="coin-icon" aria-hidden="true"></i><span class="sr-only">코인</span><strong id="coin-count">0</strong></span><span class="chip-hp"><i class="icon icon-heart" aria-hidden="true"></i><span id="hp" class="hp-bar" role="img" aria-label="HP 300 / 300"><b></b></span><strong id="hp-value">300</strong></span><span id="speed-hud" class="speed-hud">SPEED <i class="speed-meter"><b></b></i> <strong>SPIN</strong></span></div>
    <p id="status" role="status">← → / A D 이동 · Space / ↑ 점프 · 같은 방향 두 번 톡톡 스핀 대시</p>
    <nav aria-label="게임 조작">
      <div><button data-control="left" class="pad-button" aria-label="왼쪽 이동"><i class="icon icon-left" aria-hidden="true"></i></button><button data-control="right" class="pad-button" aria-label="오른쪽 이동"><i class="icon icon-right" aria-hidden="true"></i></button></div>
      <div class="actions"><button data-control="jump" class="pad-button" aria-label="점프, 길게 누르면 더 높이"><i class="icon icon-jump" aria-hidden="true"></i><span>점프</span></button></div>
    </nav>
    <section id="result" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
      <div class="result-card">
        <i class="result-badge" aria-hidden="true"></i>
        <h1 id="result-title">STAGE CLEAR!</h1>
        <p id="result-stats"></p>
        <p id="result-reward" hidden></p>
        <p id="result-bonus" hidden></p>
        <button id="result-double" type="button" hidden><span class="ad-chip">AD</span>광고 보고 2배 받기</button>
        <button id="result-next" type="button" hidden>다음 스테이지 →</button>
        <button id="result-restart" type="button">처음부터 다시 시작</button>
        <button id="result-lobby" type="button">메인 로비</button>
      </div>
    </section>
    <section id="revive" role="dialog" aria-modal="true" aria-labelledby="revive-title" hidden>
      <div class="result-card revive-card">
        <i class="result-badge" aria-hidden="true"></i>
        <h1 id="revive-title">부활할까요?</h1>
        <p id="revive-info"></p>
        <button id="revive-ad" type="button"><span class="ad-chip">AD</span>광고 보고 무료 부활</button>
        <button id="revive-coins" type="button">코인으로 부활</button>
        <button id="revive-skip" type="button">포기하기</button>
      </div>
    </section>
    <section id="unlock" role="dialog" aria-modal="true" aria-labelledby="unlock-title" hidden>
      <div class="result-card unlock-card">
        <span id="unlock-rarity" class="rarity-badge"></span>
        <img id="unlock-portrait" class="unlock-portrait" alt="" />
        <h1 id="unlock-title">새 캐릭터 획득!</h1>
        <p id="unlock-name"></p>
        <small id="unlock-more"></small>
        <button id="unlock-equip" type="button">바로 착용</button>
        <button id="unlock-keep" type="button">그대로 진행</button>
      </div>
    </section>
    <section id="tip" role="dialog" aria-modal="true" aria-labelledby="tip-title" hidden>
      <div class="tip-card">
        <span id="tip-step" class="tip-step"></span>
        <h1 id="tip-title"></h1>
        <ul id="tip-text"></ul>
        <button id="tip-continue" type="button">계속하기</button>
        <small>화면 아무 곳이나 눌러도 이어져요</small>
      </div>
    </section>
    <!-- Bottom banner ad slot (mock until Apps in Toss ads are connected). -->
    <aside id="ad-banner" aria-label="광고"><div id="ad-banner-slot">광고 · 테스트 배너 320×50</div></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
