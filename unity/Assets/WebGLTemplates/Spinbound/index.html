<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101d32">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101d32; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #101d32; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; font: 800 16px system-ui, sans-serif; background: #101d32; }
    #bar { width: min(60vw, 320px); height: 10px; border-radius: 5px; background: #ffffff22; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #5cf2ff; transition: width 0.15s; }
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #fff; font: 800 18px system-ui, sans-serif; background: #101d32ee; z-index: 2; }
    @media (orientation: portrait) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">SPINBOUND · Unity 2.5D 프로토타입<div id="bar"><div id="fill"></div></div><span id="pct">0%</span></div>
  <div id="rotate">가로로 돌려 주세요</div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const started = performance.now();
    const canvas = document.querySelector('#unity-canvas');
    createUnityInstance(canvas, {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_WASM
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // Cap the render resolution on 3x phones; the FPS counter shows what it costs.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    }, (progress) => {
      document.querySelector('#fill').style.width = `${Math.round(progress * 100)}%`;
      document.querySelector('#pct').textContent = `${Math.round(progress * 100)}%`;
    }).then((instance) => {
      document.querySelector('#loading').remove();
      const ms = Math.round(performance.now() - started);
      window.__unityLoadMs = ms;
      instance.SendMessage('Game', 'OnLoadTime', String(ms));
    }).catch((error) => {
      document.querySelector('#loading').textContent = '불러오기 실패: ' + error;
    });
  </script>
</body>
</html>
